# Data is gated: the preparation script uses an authorized cached HF login.
_base_: ../../configs/officeqa/default.yaml
model:
  backend: azure_openai
  optimizer_backend: openai_chat
  target_backend: openai_chat
  optimizer: gpt-6.1-terra
  target: gpt-6.1-terra
  reasoning_effort: high
  azure_openai_auth_mode: openai_compatible
gradient:
  analyst_workers: 2
env:
  split_dir: reproduction/data/officeqa_official
  data_dirs:
    - reproduction/data/officeqa_docs_official/treasury_bulletins_parsed
  search_mode: offline
  search_api_url: ""
  workers: 2
  exec_timeout: 600
