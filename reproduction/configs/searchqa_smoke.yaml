_base_: ../../configs/searchqa/default.yaml

model:
  backend: openai_compatible
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  optimizer: gpt-6.1-sol
  target: gpt-6.1-sol
  openai_compatible_timeout_seconds: 120
  openai_compatible_max_tokens: 4096

train:
  num_epochs: 1
  train_size: 8
  batch_size: 4
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 2

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  use_slow_update: true
  slow_update_samples: 4
  slow_update_gate_with_selection: true
  use_meta_skill: true

evaluation:
  use_gate: true
  sel_env_num: 4
  test_env_num: 8
  eval_test: true

env:
  split_dir: reproduction/data/searchqa_smoke
  workers: 2
  exec_timeout: 120
  max_completion_tokens: 2048
